services:
  backend:
    build:
      context: ./redxela_api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./redxela_client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./redxela_client/src:/app/src
      - ./redxela_client/public:/app/public
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
